[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasentinel-813"
version = "0.1.0"
description = "Explainable multi-hazard marine intake intelligence using Earth observation data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Omar Aboulwafa", email = "omaraboulwaffa@gmail.com" }
]
dependencies = [
    "pystac-client==0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
